<!doctype html><html><head><meta charset="utf-8"><title>Holobots Card Reference Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#020304;color:#eee;font-family:Arial,sans-serif}.board{width:1454px;height:760px;padding:18px 30px 24px;background:radial-gradient(circle at 50% 30%,#11151b 0,#050607 52%,#010101 100%)}
.cards{height:718px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.card{--c:#fff;position:relative;isolation:isolate;padding:34px 34px 25px;clip-path:polygon(11% 0,89% 0,100% 5%,100% 94%,94% 100%,6% 100%,0 94%,0 9%,3% 6%,3% 4%,11% 0);background:var(--c)}.card:before{content:"";position:absolute;inset:3px;z-index:-2;clip-path:inherit;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 14%,#050608),#050607 45%,color-mix(in srgb,var(--c) 8%,#030304))}.card:after{content:"";position:absolute;inset:12px;z-index:-1;clip-path:polygon(9% 0,87% 0,100% 6%,100% 93%,93% 100%,7% 100%,0 93%,0 10%,4% 6%,4% 3%,10% 0);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.strike{--c:#ff3028}.defend{--c:#2186ff}.combo{--c:#1edcea}.finisher{--c:#eab400}.top{height:78px;border-bottom:1px solid color-mix(in srgb,var(--c) 28%,transparent);display:flex;align-items:center}.cost{position:absolute;left:13px;top:4px;width:88px;height:91px;display:grid;place-items:center;color:var(--c);font-size:55px;font-weight:900;clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%);border-right:2px solid var(--c);border-bottom:2px solid var(--c)}.type{margin-left:100px;color:var(--c);font-size:31px;font-weight:900;letter-spacing:1px}.art{height:275px;display:grid;place-items:center;position:relative}.art:before{content:"";position:absolute;width:215px;height:215px;border:2px solid color-mix(in srgb,var(--c) 35%,transparent);border-radius:50%}.icon{width:240px;height:240px;object-fit:contain;filter:drop-shadow(0 0 9px var(--c))}.strike .icon{transform:translateX(3px)}.defend .icon{transform:translateX(9px)}.combo .icon{transform:translateX(11px)}.finisher .icon{transform:translateX(8px)}.name{text-align:center;font-size:30px;font-weight:900}.desc{text-align:center;color:#aaa;font-size:23px;line-height:1.45;min-height:78px;margin-top:10px}.divider{height:1px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.45;margin:10px 0 18px}.stat{height:55px;display:flex;align-items:center;justify-content:center;gap:14px;color:var(--c);font-size:27px;font-weight:900}.statmark{font-size:43px}.meter{margin:15px auto 0;width:88%;height:39px;padding:5px 10px;clip-path:polygon(6% 0,94% 0,100% 50%,94% 100%,6% 100%,0 50%);border:1px solid color-mix(in srgb,var(--c) 35%,#222);background:#080a0c;display:flex;gap:3px}.meter i{flex:1;background:#17191c;clip-path:polygon(0 0,70% 0,100% 50%,70% 100%,0 100%,30% 50%)}.meter i.on{background:var(--c)}.foot{text-align:center;color:#8c8c8c;font-size:20px;font-weight:900;margin-top:13px}.locked{opacity:.72}.locked .meter i{background:#181818}
.edge{position:absolute;pointer-events:none}.edge.a{top:16px;left:28px;width:95px;border-top:4px solid var(--c);transform:skewX(-38deg)}.edge.b{right:9px;top:92px;height:310px;border-right:2px solid color-mix(in srgb,var(--c) 45%,transparent)}
.defend .icon{transform:translateX(13px)}.finisher .icon{transform:translate(11px,7px)}
</style></head><body><main class="board"><section class="cards">
<article class="card strike"><i class="edge a"></i><i class="edge b"></i><div class="cost">1</div><div class="top"><div class="type">STRIKE</div></div><div class="art"><img class="icon" src="strike.png"></div><div class="name">Tempo Thrust</div><div class="desc">High-speed lunge.</div><div class="divider"></div><div class="stat"><b class="statmark">✹</b>14 DMG</div><div class="meter"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></div><div class="foot">SPEED</div></article>
<article class="card defend"><i class="edge a"></i><i class="edge b"></i><div class="cost">1</div><div class="top"><div class="type">DEFEND</div></div><div class="art"><img class="icon" src="defend.png"></div><div class="name">Safety Protocol</div><div class="desc">Block and reduce<br>incoming damage.</div><div class="divider"></div><div class="stat"><b class="statmark">♢</b>BLOCK</div><div class="meter"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div><div class="foot">GUARD</div></article>
<article class="card combo"><i class="edge a"></i><i class="edge b"></i><div class="cost">2</div><div class="top"><div class="type">COMBO</div></div><div class="art"><img class="icon" src="combo.png"></div><div class="name">Chain Burst</div><div class="desc">Follow-up strike<br>that chains.</div><div class="divider"></div><div class="stat"><b class="statmark">ϟ</b>14 DMG</div><div class="meter"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></div><div class="foot">COMBO GAIN</div></article>
<article class="card finisher locked"><i class="edge a"></i><i class="edge b"></i><div class="cost">4</div><div class="top"><div class="type">FINISHER</div></div><div class="art"><img class="icon" src="finisher.png"></div><div class="name">Tactical Override</div><div class="desc">Powerful finisher<br>with high impact.</div><div class="divider"></div><div class="stat"><b class="statmark">▣</b>LOCKED</div><div class="meter"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="foot">NEEDS METER</div></article>
</section></main></body></html>
