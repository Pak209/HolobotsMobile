<!doctype html><html><head><meta charset="utf-8"><title>Holobots Battle Card Animation</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;display:grid;place-items:center;min-height:100vh;font-family:Arial,sans-serif}.phone{position:relative;width:402px;height:902px;overflow:hidden;background:#f8ca00}.screen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.bay{position:absolute;left:12px;top:487px;width:366px;height:222px;background:#050606;border:3px solid #171717;padding:15px 9px 10px}.meter{position:absolute;left:10px;right:10px;top:12px;height:11px;background:#292616}.hint{position:absolute;right:10px;top:28px;color:#807c6e;font-size:7px;font-weight:900}.cards{position:absolute;left:9px;right:9px;bottom:10px;height:156px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.card{--c:#fff;position:relative;border:0;padding:12px 5px 7px;color:#fff;background:var(--c);clip-path:polygon(15% 0,84% 0,100% 9%,100% 89%,87% 100%,13% 100%,0 89%,0 17%,15% 7%);cursor:pointer;isolation:isolate;transform-origin:center 85%;transition:filter .15s}.card:before{content:"";position:absolute;inset:3px;z-index:-2;clip-path:inherit;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 16%,#050608),#050607 50%,color-mix(in srgb,var(--c) 8%,#030304))}.card:after{content:"";position:absolute;inset:7px;z-index:-1;clip-path:polygon(13% 0,82% 0,100% 10%,100% 88%,86% 100%,14% 100%,0 88%,0 20%,15% 9%);border:1px solid color-mix(in srgb,var(--c) 48%,transparent)}.strike{--c:#ff4438}.defend{--c:#238cff}.combo{--c:#20dcef}.finisher{--c:#ddb20b;opacity:.48}.cost{position:absolute;left:8px;top:5px;color:var(--c);font-size:17px;font-weight:900}.type{margin-left:12px;color:var(--c);font-size:8px;font-weight:900;letter-spacing:.6px}.icon{display:block;width:59px;height:59px;object-fit:contain;margin:10px auto 1px;filter:drop-shadow(0 0 3px var(--c))}.defend .icon{transform:translateX(3px)}.combo .icon{transform:translateX(3px)}.finisher .icon{transform:translate(3px,2px)}.name{font-size:8px;font-weight:900;line-height:9px;min-height:19px}.damage{color:var(--c);font-size:8px;font-weight:900}.lock{position:absolute;left:6px;right:6px;bottom:4px;background:#090909;border:1px solid #333;color:#aaa;font-size:6px;padding:2px}.burst{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 58%,white 0 4%,var(--c) 5% 11%,transparent 35%)}.streak{position:absolute;left:-65%;top:48%;width:230%;height:4px;background:linear-gradient(90deg,transparent,var(--c),white,var(--c),transparent);transform:rotate(-18deg) scaleX(.15);opacity:0;filter:drop-shadow(0 0 6px var(--c));pointer-events:none}.played{z-index:9;animation:cardPlay 900ms cubic-bezier(.2,.8,.2,1)}.played .icon{animation:iconHit 900ms ease-out}.played .burst{animation:burst 900ms ease-out}.played .streak{animation:streak 900ms ease-out}.bay.hit{animation:bayHit 260ms ease-out 430ms}.ticker{position:absolute;left:14px;top:455px;width:362px;height:31px;background:#050606;border:2px solid #f0bf14;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900}.impact{position:absolute;left:150px;top:300px;width:105px;height:105px;border:3px solid #20dcef;border-radius:50%;opacity:0;pointer-events:none}.impact.show{animation:impact 650ms ease-out 330ms}
@keyframes cardPlay{0%{transform:translateY(0) scale(1)}18%{transform:translateY(-15px) scale(1.1);filter:brightness(1.7)}42%{transform:translateY(-8px) scale(1.06)}58%{transform:translateY(-8px) scale(1.06)}100%{transform:translateY(0) scale(1)}}@keyframes iconHit{0%,15%{transform:scale(1)}36%{transform:scale(1.28) rotate(-5deg);filter:drop-shadow(0 0 10px var(--c)) brightness(2)}62%{transform:scale(.94)}100%{transform:scale(1)}}@keyframes burst{0%,20%{opacity:0;transform:scale(.35)}38%{opacity:.9;transform:scale(1)}62%,100%{opacity:0;transform:scale(1.65)}}@keyframes streak{0%,28%{opacity:0;transform:rotate(-18deg) scaleX(.15)}43%{opacity:1;transform:rotate(-18deg) scaleX(1)}62%,100%{opacity:0;transform:rotate(-18deg) scaleX(1.15)}}@keyframes bayHit{0%,100%{transform:translateX(0)}35%{transform:translateX(-2px)}65%{transform:translateX(2px)}}@keyframes impact{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
@media(prefers-reduced-motion:reduce){.played,.played .icon,.played .burst,.played .streak,.bay.hit,.impact.show{animation:none!important}}
body{place-items:start}
</style></head><body><main class="phone"><img class="screen" src="battle-reference.png"><div class="ticker">Chain Burst · 7 DMG</div><section class="bay"><div class="meter"></div><div class="hint">TAP A MOVE TO FIGHT</div><div class="cards">
<button class="card strike" data-name="Tempo Thrust"><span class="cost">1</span><div class="type">STRIKE</div><img class="icon" src="strike.png"><div class="name">Tempo<br>Thrust</div><div class="damage">14 DMG</div><i class="burst"></i><i class="streak"></i></button>
<button class="card defend" data-name="Safety Protocol"><span class="cost">1</span><div class="type">DEFEND</div><img class="icon" src="defend.png"><div class="name">Safety<br>Protocol</div><div class="damage">BLOCK</div><i class="burst"></i><i class="streak"></i></button>
<button class="card combo" data-name="Chain Burst"><span class="cost">2</span><div class="type">COMBO</div><img class="icon" src="combo.png"><div class="name">Chain Burst</div><div class="damage">14 DMG</div><i class="burst"></i><i class="streak"></i></button>
<button class="card finisher" data-name="Tactical Override"><span class="cost">4</span><div class="type">FINISHER</div><img class="icon" src="finisher.png"><div class="name">Tactical<br>Override</div><div class="lock">NEEDS METER</div><i class="burst"></i><i class="streak"></i></button></div></section><div class="impact"></div></main><script>
const bay=document.querySelector('.bay'),impact=document.querySelector('.impact'),ticker=document.querySelector('.ticker');function play(card){if(card.classList.contains('finisher'))return;document.querySelectorAll('.played').forEach(x=>x.classList.remove('played'));void card.offsetWidth;card.classList.add('played');bay.classList.remove('hit');impact.classList.remove('show');void bay.offsetWidth;bay.classList.add('hit');impact.classList.add('show');ticker.textContent=card.dataset.name+' · '+(card.classList.contains('defend')?'BLOCK':'14 DMG');setTimeout(()=>{card.classList.remove('played');bay.classList.remove('hit');impact.classList.remove('show')},950)}document.querySelectorAll('.card').forEach(c=>c.onclick=()=>play(c));setTimeout(()=>play(document.querySelector('.combo')),350);
</script></body></html>
